services:
  audiohub:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: audiohub
    restart: unless-stopped
    ports:
      # loopback only — nginx on the host proxies to this port and terminates TLS
      - "127.0.0.1:8420:8420"
    volumes:
      - ./data:/data
      # Whole drive. Pick specific subfolders as library roots in Settings afterwards (e.g.
      # container path /library/v/Download/Audio) — mounting the whole drive here does not mean
      # the whole drive gets scanned.
      #
      # Writable (no :ro) so the Soundgasm importer can save downloads under
      # /library/v/.../Soundgasm/<username>, and so deleting a folder can move it into
      # /library/v/.audiohub-trash rather than failing on a read-only mount.
      - "V:/:/library/v"
      # Add more lines here for any other drives/folders you want available to pick from.
      # - "D:/Audiobooks:/library/audiobooks:ro"
    environment:
      PORT: 8420
      NODE_ENV: production
      DATABASE_PATH: /data/audiohub.db
      COVER_CACHE_DIR: /data/cache/covers
      # Persisted in the /data volume so the ~550MB whisper model survives container recreation
      # instead of re-downloading on every redeploy.
      WHISPER_MODEL_DIR: /data/whisper-models
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"

networks:
  default:
    name: nginx-proxy-nw
    external: true
