name: Build and publish Docker image

# Builds the AudioHub image from backend/Dockerfile and publishes it to GitHub Container
# Registry, so a cloud deployment can just `docker compose pull` instead of building from
# source. See docker-compose.cloud.yml for an example that consumes this image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  # Hardcoded (rather than derived from github.repository) because GHCR image refs must be
  # lowercase and the repo name itself ("AudioHub") isn't.
  IMAGE_NAME: zebede1980/audiohub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        # Lets the (amd64) GitHub runner emulate arm64 to cross-build for it below — needed for
        # arm64 cloud boxes (e.g. Oracle Cloud's Ampere instances) to be able to `docker compose
        # pull` instead of building from source.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          # arm64 builds under QEMU emulation — noticeably slower than the native amd64 build
          # (whisper.cpp's C++ build is the biggest chunk of it), but this only runs on push
          # to main/tags, not on every commit.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
