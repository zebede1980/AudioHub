##
## Example compose file for a cloud/remote AudioHub instance — the sync target that a local
## AudioHub pushes its top-rated files to (see the "Cloud sync" section in Settings — the rating
## threshold is configurable, 3+/4+/5-only).
##
## Differences from the main docker-compose.yml (which is written for the machine that owns the
## real library and builds its own image):
##   - Pulls a prebuilt image from GHCR instead of building from source, published by
##     .github/workflows/docker-publish.yml on every push to main.
##   - One writable ./library volume instead of mounting whole drives — the cloud box doesn't
##     hold the full library, only what gets synced in under library/Synced/...
##
## First-time setup:
##   1. Push to main once so the publish workflow runs, then make the GHCR package public
##      (repo -> Packages -> audiohub -> Package settings -> Change visibility), or `docker
##      login ghcr.io` on this host with a PAT that has `read:packages` — otherwise `pull` below
##      will fail with "unauthorized".
##   2. Copy .env.example to .env here and fill it in (see that file for details).
##   3. docker compose -f docker-compose.cloud.yml up -d
##   4. In the AudioHub UI: Settings -> Add a folder -> point it at /library (creates the
##      library root), then Settings -> Cloud sync -> "Accept pushes from a local instance" ->
##      pick that folder, generate a key, and paste this server's URL + that key into the
##      "Push to a cloud instance" section on your local AudioHub.
##
## To update to the latest published image later:
##   docker compose -f docker-compose.cloud.yml pull && docker compose -f docker-compose.cloud.yml up -d
##
## Reverse proxy (terminate TLS, expose a domain):
## Point an A record for your chosen subdomain at this box's IP first — needed either way, for the
## proxy's own TLS cert. Then, in whatever proxies to 127.0.0.1:8420:
##   - Raise the upload size limit — nginx's default (1MB) will reject a synced audiobook file long
##     before it reaches AudioHub (which itself accepts up to 5GB): `client_max_body_size 2G;`
##   - Raise proxy timeouts for the same reason, over a slow home upload link: `proxy_read_timeout
##     300s;` and `proxy_send_timeout 300s;`
##   - Set the standard forwarded headers (Host, X-Real-IP, X-Forwarded-For, X-Forwarded-Proto,
##     X-Forwarded-Host) — AudioHub's CSRF check and login rate-limiting rely on them being correct.
##
## Plain nginx example:
##   server {
##     listen 443 ssl;
##     server_name audiohub.yourdomain.com;
##     ssl_certificate     /etc/letsencrypt/live/audiohub.yourdomain.com/fullchain.pem;
##     ssl_certificate_key /etc/letsencrypt/live/audiohub.yourdomain.com/privkey.pem;
##     client_max_body_size 2G;
##     proxy_read_timeout   300s;
##     proxy_send_timeout   300s;
##     location / {
##       proxy_pass http://127.0.0.1:8420;
##       proxy_set_header Host              $host;
##       proxy_set_header X-Real-IP         $remote_addr;
##       proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
##       proxy_set_header X-Forwarded-Proto $scheme;
##       proxy_set_header X-Forwarded-Host  $host;
##     }
##   }
##
## Nginx Proxy Manager instead: Add Proxy Host -> Details tab: Scheme http, Forward Hostname/IP +
## Forward Port as below, Websockets Support off (not used) -> SSL tab: request/attach the cert ->
## Advanced tab, Custom Nginx Configuration:
##   client_max_body_size 2G;
##   proxy_read_timeout 300s;
##   proxy_send_timeout 300s;
## (NPM sets the forwarded headers for you.)
##
## Forward Hostname/IP depends on where NPM runs:
##   - NPM as its own container (as in the local docker-compose.yml's nginx-proxy-nw pattern): it
##     can't reach 127.0.0.1:8420 below — that's NPM's own container loopback, not the host's. Put
##     this audiohub service on the same external Docker network as your NPM container (add a
##     top-level `networks:` block here plus `networks: [that-network]` under the audiohub service,
##     matching how docker-compose.yml joins nginx-proxy-nw) and set Forward Hostname/IP to this
##     container's name (`audiohub-cloud`), Forward Port 8420 — not an IP at all.
##   - NPM running directly on this host (not containerized), or a plain host-level nginx as in the
##     example above: Forward Hostname/IP is `127.0.0.1`, Forward Port `8420`, exactly as published
##     below.
##
services:
  audiohub:
    image: ghcr.io/zebede1980/audiohub:latest
    container_name: audiohub-cloud
    restart: unless-stopped
    ports:
      # Loopback only — this host's own nginx (or whatever terminates TLS for your domain) proxies
      # to this port. Do not publish this directly to the internet.
      - "127.0.0.1:8420:8420"
    volumes:
      - ./data:/data
      # Everything synced in from a local instance lands under here, at /library/Synced/...
      - ./library:/library
    environment:
      PORT: 8420
      NODE_ENV: production
      DATABASE_PATH: /data/audiohub.db
      COVER_CACHE_DIR: /data/cache/covers
      WHISPER_MODEL_DIR: /data/whisper-models
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
